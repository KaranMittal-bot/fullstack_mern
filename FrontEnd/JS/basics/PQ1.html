<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>
        Practice/Assignment ques
    </h1>

    <script>

        //print good if num/10==0 else bad
        let num =15;

        if(num/10==0){
            console.log("Good");
        }else{
            console.log("Bad");
        }


        //Take user's name and age using prompt and display it using alert using literals

        let name= prompt("Please ENTER YOUR NAME: ");
        let age = prompt("Please Enter Your age: ");

        alert(`Your name is ${name} and age is ${age}`);


        //if a string starts with 'a' and string length is >= 5 , then print golden else bad string

        let str="apple";

        if(str[0]=='a' && str.length>=5){
            console.log("Golden string");
        }else{
            console.log("Bad string");
        }


        //largest of 3

        let a=10,b=20, c=30;

        if(a>b && a>c){
            console.log(`${a} is greatest`);
        }else if(b>a && b>c){
            console.log(`${b} is greatest`);
        }else{
            console.log(`${c} is greatest`);
        }


    </script>
</body>
