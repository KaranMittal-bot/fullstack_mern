<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
        <ol><!--ordered list, where the order of items is important-->
            <li>Frontend</li><!--list item-->
            <li>Backend</li>
            <li>DevOps</li>
        </ol>

        <ul><!--unordered list , where the order of items isn't important-->
            <li>Frontend</li><!--list item-->
            <li>Backend</li>
            <li>DevOps</li>
        </ul>

        <!--to get a video from youtube using embedding-->
        <iframe 
            width="560"
            height="315" 
            src="https://www.youtube.com/embed/S-CQPm9IIwo?si=hV_aKcDBi7wneA6r" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
        </iframe>

        <!-- block level elements -->
         <div>
            <h2>Block level elements</h2>
            <ul> 
                <li>headings H1 to H6</li>
                <li>ol and ul</li>
                <li>li</li>
                <li>paragraph</li>
            </ul>
         </div>

         <!-- inline elements -->
         <div>
            <h2>Inline elements</h2>
            <ul>
                <li>anchor tags</li>
                <li>img tag</li>
                <li>strong tag</li>
                <li>emphasis tag(em)</li>
            </ul>
         </div>
</body>
</html>
