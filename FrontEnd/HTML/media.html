<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
</head>
<body>
    <h1>This is Media Learning</h1>
    <img src="./img1.jpeg" width="200px" alt="not found">
    
    <!-- figure tag is an alt tag of image tag -->
    <figure>
        <img 
        src="./img1.jpeg" 
        alt="Ni mila bsdk"
        width="200px"/>

        <figcaption>
            MEME LOL
        </figcaption>
    </figure>

    <iframe 
        width="560" 
        height="315" 
        src="https://youtu.be/K051lG494DA?si=QNJPUHr2A0rCQw7A"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

     

</body>
</html>
