<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>Login Form</h1>

    <form>

        <label for="name">
            Name:
            <input placeholder="Enter your name" type="text" name="name">
        </label> <br>

        <label for="email">
            Email:
            <input placeholder="Enter your email" type="email" name="email">
        </label><br>

        <label for="password">
            password:
            <input placeholder="Enter your pass " type="password" name="password">
        </label><br>

        <label for="text">
            Text:
        <textarea name="text">Tell us your story..</textarea>
        </label><br>

        <label for="Url">
            Url
            <input placeholder="Enter the URL" type="url" name="url">
        </label><br>

        <label for="Gender">
            Male <input type="radio" name="Male">
        </label>

        <label for="Gender">
            Female <input type="radio" name="Female">
        </label><br>

        <label for="Games">
            Choose 1:
            <select name="Games">
                <option value="Cricket">Cricket</option>
                <option value="Baseball">Baseball</option>
            </select>
        </label><br>

        <label for="month">
            Month:
            <input type="month">
        </label><br>

        <label for="">
            File: <input type="file">
        </label><br>

        <label for="color">
            Color: <input type="color">
        </label><br>

        <button type="submit">submit</button>

    </form>
</body>
</html>
