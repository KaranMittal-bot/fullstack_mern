<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Grid Layout</title>

<style>

body{
    margin:0;
}

/* GRID CONTAINER */

.container{
    display:grid;
    grid-template-columns: repeat(12,1fr);
    grid-template-rows: repeat(12,1fr);
    gap:10px;
    height:100vh;
}

/* GRID ITEMS */

.container div{
    background:pink;
    border:2px solid white;
}

/* DESKTOP LAYOUT */

.header{
    grid-column:1 / 13;
    grid-row:1 / 2;
}

.sidebar{
    grid-column:1 / 4;
    grid-row:2 / 12;
}

.navigation{
    grid-column:4 / 10;
    grid-row:2 / 3;
}

.main{
    grid-column:4 / 10;
    grid-row:3 / 12;
}

.ads{
    grid-column:10 / 13;
    grid-row:2 / 12;
}

.footer{
    grid-column:1 / 13;
    grid-row:12 / 13;
}

/* MOBILE LAYOUT */

@media (max-width:720px){

.header{
    grid-column:1 / 13;
    grid-row:1 / 2;
}

.navigation{
    grid-column:1 / 13;
    grid-row:2 / 3;
}

.sidebar{
    grid-column:1 / 4;
    grid-row:3 / 12;
}

.main{
    grid-column:4 / 13;
    grid-row:3 / 12;
}

.ads{
    grid-column:1 / 4;
    grid-row:12 / 13;
}

.footer{
    grid-column:4 / 13;
    grid-row:12 / 13;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">header</div>
<div class="sidebar">sidebar</div>
<div class="navigation">navigation</div>
<div class="ads">ads</div>
<div class="main">main</div>
<div class="footer">footer</div>

</div>

</body>
</html>
