<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      
      *{
        margin: 0;
        padding: 0;
        font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      }

      .main_box{
        background-image: url(/images/photo.jpg);
        height: 100vh;
        background-size: cover;
      }

      .btn_one{
        color: white;
        font-size: 30px;
        font-weight: 700;
        position: absolute;
        left: 15px;
        line-height: 60px;
      }

      .sidebar_menu{
        position: fixed;
        left: -350px;
        height: 100vh;
        width: 300px;
        background-color: rgba(255,255,255,0.1);
        box-shadow: 2px 2px 10px gray;
        transition: 0.5s;
      }

      .sidebar_menu .logo{
        position: absolute;
        line-height: 60px;
        box-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        width: 100%;
      }

      .sidebar_menu .logo a{
        position: absolute;
        left: 50px;
        color: white;
        text-decoration: none;
        font-size: 20px;
        font-weight: 500;
      }

      .sidebar_menu .btn_two i{
        color: gray;
        font-size: 25px;
        line-height: 60px;
        position: absolute;
        left: 275px;
        /* opacity: 0; */
        cursor: pointer;
      }

      .sidebar_menu .menu{
        position: absolute;
        width:100%;
        top:80px;
      }

      .sidebar_menu .menu li{
        margin-top: 6px;
        padding: 10px 20px;
      }

      .sidebar_menu .menu i, a{
        color: white;
        text-decoration: none;
        font-size: 20px;
      }

      .sidebar_menu .menu i{
        padding-right: 10px;
      }

      .sidebar_menu .social_media{
        color: white;
        opacity: 0.5;
        position: absolute;
        left: 25%;
        bottom: 20px;
        transition: 0.2s;
      }
      
      .sidebar_menu .social_media i{
        color: white;
        opacity: 0.5;
        padding-right: 10px;
        transition: 0.3s;
      }

      #check{
        display: none;
      }

      .sidebar_menu  .menu li:hover{
        box-shadow: 2px 2px 4px rgba(255,255,255,0.5);
      }

      .btn_one i:hover{
        font-size: 40px;
      }

      .btn_two i:hover{
        transition: 0.3s;
        font-size: 28px;
      }

      .sidebar_menu .social_media i:hover{
        opacity: 1;
        transform: scale(1.1);
        transition: 0.3s;
      }

      #check:checked  ~ .sidebar_menu{
        left: 0;
        transition-timing-function: ease-in;
      }

      #check:checked ~ .btn_one i{
        opacity: 0;
      }

    </style>

  </head>
  <body>

    <div class="main_box">

      <input type="checkbox" id="check" />

      <div class="btn_one">
        <label for="check" style="color: rgb(255,255,255)">
          <i class="fa-solid fa-bars"></i>
        </label>
      </div>

      <div class="sidebar_menu">
        <div class="logo">
          <a href="#">Karan Mittal</a>
        </div>

        <div class="btn_two">
          <label for="check" >
            <i class="fa-solid fa-xmark"></i>
          </label>
        </div>

        <div class="menu">
          <ul>
            <li>
              <i class="fa-solid fa-image"></i>
              <a href="#">Gallery</a>
            </li>
            <li>
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
              <a href="#">Shortcuts</a>
            </li>
            <li>
              <i class="fa-solid fa-photo-film"></i>
              <a href="#">Exhibits</a>
            </li>
            <li>
              <i class="fa-solid fa-calendar-days"></i>  
              <a href="#">Events</a>
            </li>
            <li>
              <i class="fa-solid fa-store"></i>
              <a href="#">Store</a>
            </li>
            <li>
              <i class="fa-solid fa-phone"></i>
              <a href="#">Contact</a>
            </li>
            <li>
              <i class="fa-regular fa-comments"></i>
              <a href="#">Feedback</a>
            </li>
          </ul>
        </div>

        <div class="social_media">
          <ul>
            <a href="#"><i class="fa-brands fa-facebook"></i></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="https://www.instagram.com/karannmittalll/?hl=en"><i class="fa-brands fa-instagram"></i></i></a>
            <a href="https://www.youtube.com/shorts/_6HzLIJPH2A"><i class="fa-brands fa-youtube"></i></a>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
